<style>
:root{--ink:#0f2236;--sky1:#c9dae7;--sky2:#eef0ee;--paper:#f8f5ee;--flap:#6f8ca7}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(180deg,var(--sky1),var(--sky2) 62%,#f3efe6);color:var(--ink);font:400 1.15rem/1.55 Newsreader,Georgia,serif}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.intro{position:fixed;z-index:3;left:3.5vw;top:5vh;max-width:25ch}
.intro p{margin-bottom:1.4rem}
.btn{position:relative;border:0;cursor:pointer;background:var(--ink);color:var(--paper);padding:.9rem 1.7rem 1rem;font:600 1rem 'Bricolage Grotesque',system-ui,sans-serif;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.btn::after{content:"";position:absolute;top:0;right:0;width:18px;height:18px;background:linear-gradient(to bottom left,transparent 50%,var(--flap) 50%)}
.btn:hover{background:#1b3a57}.btn:focus-visible{outline:3px solid #e4402f;outline-offset:3px}
#st{position:fixed;z-index:3;right:3.5vw;top:5vh;font:600 .95rem 'Bricolage Grotesque',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.word{position:fixed;z-index:1;left:3vw;bottom:7vh;font:800 clamp(7rem,26vw,25rem)/.82 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.045em;perspective:1100px;user-select:none}
.word span{display:block;color:var(--ink)}
.word .t{clip-path:inset(0 0 50% 0)}
.word .b{position:absolute;inset:0;clip-path:inset(50% 0 0 0);transform-origin:50% 50%;transform:rotateX(-34deg);color:#26496b}
.word::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,255,255,.75)}
footer{position:fixed;z-index:3;left:3.5vw;right:3.5vw;bottom:1.6vh;font-size:.78rem;line-height:1.35;opacity:.8}
footer a{color:inherit}
#load{position:fixed;z-index:4;inset:0;display:grid;place-items:center;background:var(--sky2);font:italic 1.4rem Newsreader,Georgia,serif;transition:opacity .6s}
@media (max-width:640px){.intro{max-width:19ch;font-size:1.02rem}#st{display:none}}
</style>

<body>
<div id="load">Unfolding…</div>
<div class="intro">
  <p>Every plane starts as a flat sheet of paper. Watch these ones fold themselves, one crease at a time, then take off.</p>
  <button class="btn" id="go" type="button">Fold another</button>

        a+=((hi[i]<<24)|(lo[i]<<16))>>16;
        b+=((hi[i+1]<<24)|(lo[i+1]<<16))>>16;
        c+=((hi[i+2]<<24)|(lo[i+2]<<16))>>16;
        P[o]=a*U;P[o+1]=c*U;P[o+2]=-b*U; // model (x,y,z) -> three (x,z,-y)
        s[0]+=P[o];s[1]+=P[o+1];s[2]+=P[o+2];
      }
    }
    poses.push(P);cent.push(s.map(v=>v/(R*C)));
  }
  return {poses,cent};
}
//DECODE_END
if(!('DecompressionStream' in window)){$('load').textContent='This page needs a current browser (Chrome, Edge, Safari 16.4+ or Firefox 113+).';return}
const raw=Uint8Array.from(atob(B64),c=>c.charCodeAt(0));
const buf=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer());
const {poses,cent}=decode(buf),per=R*C*3;

// ---- shared grid topology ----
const cols=[];for(let i=0;i<=296;i+=2)cols.push(i);cols.push(297);
const rows=[];for(let j=0;j<=210;j+=2)rows.push(j);
const uv=new Float32Array(R*C*2),idx=new Uint16Array((R-1)*(C-1)*6);
for(let r=0;r<R;r++)for(let k=0;k<C;k++){uv[(r*C+k)*2]=cols[k]/297;uv[(r*C+k)*2+1]=rows[r]/210}
let n=0;for(let r=0;r<R-1;r++)for(let k=0;k<C-1;k++){const a=r*C+k,b=a+1,c=a+C+1,d=a+C;idx.set([a,b,c,a,c,d],n);n+=6}

// ---- scene ----
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,K=reduce?.6:1;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0,0);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.1,120);
let aspect=1,baseZ=11;
function resize(){const w=innerWidth,h=innerHeight;aspect=w/h;renderer.setSize(w,h);camera.aspect=aspect;baseZ=11*Math.max(1,1.1/aspect);camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
scene.add(new THREE.HemisphereLight(0xffffff,0xaebfcc,.85));
const sun=new THREE.DirectionalLight(0xffffff,1.15);sun.position.set(-5,14,7);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:.5,far:50});
sun.shadow.bias=-.0008;sun.shadow.normalBias=.02;sun.shadow.radius=3;scene.add(sun);
const fill=new THREE.DirectionalLight(0xdfe9ff,.45);fill.position.set(3,2,10);scene.add(fill);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(90,90),new THREE.ShadowMaterial({opacity:.16}));
ground.rotation.x=-Math.PI/2;ground.position.y=-3;ground.receiveShadow=true;scene.add(ground);

// paper grain + faint centre guide
const cv=document.createElement('canvas');cv.width=512;cv.height=362;
const g2=cv.getContext('2d'),im=g2.createImageData(512,362);
for(let i=0;i<512*362;i++){const v=236+Math.random()*19|0;im.data.set([v,v,v,255],i*4)}
g2.putImageData(im,0,0);g2.fillStyle='rgba(15,34,54,.1)';g2.fillRect(0,180,512,1.5);
const tex=new THREE.CanvasTexture(cv);tex.anisotropy=4;

// ---- planes ----
const COLORS=[0xe4402f,0xf1b434,0x2c8c83,0x3f5bd8,0xe9829f,0x7a5fc4,0x1f3d63,0x86bf6b];
const SLOTS=[[1.6,.4,.5,1.55],[-3.6,1.1,-1,1.1],[5,.3,-1.6,1.15],[-1.2,-.4,2.6,.9],[3,2.1,-3.5,1],[-6,.2,-3,.9],[.4,2.4,-1,.8],[6.2,-.6,1.2,.8]];
const mat=(c,side)=>new THREE.MeshStandardMaterial({color:c,side,map:tex,roughness:.9,flatShading:true});
const planes=SLOTS.map((s,i)=>{
  const geo=new THREE.BufferGeometry(),pos=new THREE.BufferAttribute(new Float32Array(per),3);
  pos.setUsage(THREE.DynamicDrawUsage);geo.setAttribute('position',pos);
  geo.setAttribute('uv',new THREE.BufferAttribute(uv,2));geo.setIndex(new THREE.BufferAttribute(idx,1));
  const a=new THREE.Mesh(geo,mat(COLORS[i],THREE.FrontSide)),b=new THREE.Mesh(geo,mat(0xf8f5ee,THREE.BackSide));
  a.castShadow=true;a.material.shadowSide=THREE.DoubleSide;a.frustumCulled=b.frustumCulled=false;
  const g=new THREE.Group();g.add(a,b);g.visible=false;scene.add(g);
  return {g,pos,s,i,state:'wait',t:0,wait:.3+i*2.2,seed:Math.random()*6.28,sc:s[3],bank:0};
});

function fill_(p,u){
  u=Math.max(0,Math.min(F-1-1e-5,u));const f=u|0,t=u-f,A=poses[f],B=poses[f+1],ca=cent[f],cb=cent[f+1],o=p.pos.array;
  const x=ca[0]+(cb[0]-ca[0])*t,y=ca[1]+(cb[1]-ca[1])*t,z=ca[2]+(cb[2]-ca[2])*t;
  for(let i=0;i<per;i+=3){o[i]=A[i]+(B[i]-A[i])*t-x;o[i+1]=A[i+1]+(B[i+1]-A[i+1])*t-y;o[i+2]=A[i+2]+(B[i+2]-A[i+2])*t-z}
  p.pos.needsUpdate=true;
}
const V=(x,y,z)=>new THREE.Vector3(x,y,z),sm=k=>{k=Math.max(0,Math.min(1,k));return k*k*(3-2*k)};
const up=V(0,1,0),fa=V(0,0,0),fb=V(0,0,0),ua=V(0,0,0),za=V(0,0,0),mx=new THREE.Matrix4(),eu=new THREE.Euler(),qa=new THREE.Quaternion(),qb=new THREE.Quaternion();
const dispQ=(p,t,out)=>out.setFromEuler(eu.set(.95+Math.sin(t*.5+p.seed)*.08,Math.sin(t*.35+p.seed)*.4+(p.s[0]>0?-.25:.25),0,'YXZ'));
function flightQ(p,t,bank,out){
  p.curve.getTangentAt(Math.min(t,.999),fa);
  ua.copy(up).addScaledVector(fa,-up.dot(fa)).normalize().applyAxisAngle(fa,bank);
  za.crossVectors(fa,ua);return out.setFromRotationMatrix(mx.makeBasis(fa,ua,za));
}
let queued=0;
function start(p){
  const fx=Math.min(1,aspect/1.4),h=V(p.s[0]*fx,p.s[1],p.s[2]),dir=h.x>1?-1:(Math.random()<.5?1:-1),far=Math.random()<.6,R_=Math.random;
  const end=far?V(h.x+dir*(6+R_()*6),2+R_()*4,-26):V(dir*(14+R_()*3),1+R_()*4,h.z+R_()*4-2);
  const m1=h.clone().add(V(dir*(2+R_()*2),1.2+R_()*1.5,-1-R_()*2)),m2=h.clone().lerp(end,.55).add(V(-dir*(1+R_()*3),R_()*4-1,R_()*3));
  Object.assign(p,{home:h,curve:new THREE.CubicBezierCurve3(h,m1,m2,end),fdur:11+R_()*4,state:'drop',t:0,bank:0});
  fill_(p,0);p.g.visible=true;
}
const FOLD=9;
function update(p,dt,time){
  if(p.state==='wait'){p.wait-=dt;if(p.wait<=0)start(p);return}
  p.t+=dt;const g=p.g,hov=Math.sin(time*.7+p.seed)*.08;
  if(p.state==='drop'){
    const k=Math.min(1,p.t),e=1-Math.pow(1-k,3);
    g.scale.setScalar(p.sc*Math.max(e,.001));g.position.set(p.home.x,p.home.y+(1-e)+hov,p.home.z);dispQ(p,time,g.quaternion);
    if(k>=1){p.state='fold';p.t=0}
  }else if(p.state==='fold'){
    const k=Math.min(1,p.t/FOLD),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    fill_(p,e*(F-1));g.position.set(p.home.x,p.home.y+hov,p.home.z);dispQ(p,time,g.quaternion);
    if(k>=1){p.state='hold';p.t=0}
  }else if(p.state==='hold'){
    const e=sm(p.t/1.4);g.position.set(p.home.x,p.home.y+hov,p.home.z);g.scale.setScalar(p.sc*(1-.2*e));
    dispQ(p,time,qa);flightQ(p,0,0,qb);g.quaternion.copy(qa).slerp(qb,e);
    if(p.t>=1.4){p.state='fly';p.t=0}
  }else{
    const k=Math.min(1,p.t/p.fdur),tt=Math.pow(k,1.25);
    p.curve.getPointAt(tt,g.position);g.position.y+=hov*.4;
    p.curve.getTangentAt(Math.min(tt,.999),fa);p.curve.getTangentAt(Math.min(tt+.03,.999),fb);
    const turn=fa.z*fb.x-fa.x*fb.z,goal=Math.max(-.8,Math.min(.8,-turn*3))+Math.sin(time*1.7+p.seed)*.12;
    p.bank+=(goal-p.bank)*Math.min(1,dt*2.5);flightQ(p,tt,p.bank,g.quaternion);
    g.scale.setScalar(p.sc*.8*(1-sm((k-.88)/.12)));
    if(k>=1){g.visible=false;p.state='wait';p.wait=queued>0?(queued--,0):1+Math.random()*3}
  }
}
$('go').onclick=()=>{const w=planes.filter(p=>p.state==='wait').sort((a,b)=>a.wait-b.wait)[0];w?w.wait=0:queued++};

let mxp=0,myp=0,time=0,last=performance.now(),lastTxt='';
addEventListener('pointermove',e=>{mxp=e.clientX/innerWidth-.5;myp=e.clientY/innerHeight-.5});
setInterval(()=>{
  const c=s=>planes.filter(p=>p.state===s).length,t=`${c('fly')} flying, ${planes.filter(p=>p.state==='drop'||p.state==='fold'||p.state==='hold').length} folding, ${c('wait')} resting`;
  if(t!==lastTxt)$('st').textContent=lastTxt=t;
},300);
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000)*K;last=now;time+=dt;
  planes.forEach(p=>update(p,dt,time));
  const px=reduce?0:mxp,py=reduce?0:myp;
  camera.position.x+=(px*1.6-camera.position.x)*.04;camera.position.y+=(2.2-py*.8-camera.position.y)*.04;camera.position.z=baseZ;
  camera.lookAt(0,.3,0);renderer.render(scene,camera);
}
requestAnimationFrame(loop);
const L=$('load');L.style.opacity=0;setTimeout(()=>L.remove(),700);
})();
</script>
</body>
