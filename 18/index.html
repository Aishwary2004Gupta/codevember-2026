<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Pendulum</title>
  <script type="importmap">

<body data-scene="triple">
  <canvas id="scene" aria-label="An animated brass triple-pendulum mechanism on a dark display base."></canvas>
  <video id="pendulum-video" muted loop playsinline preload="metadata" aria-hidden="true">

  <button id="previous-scene" type="button" aria-label="Previous pendulum scene">
    <span class="arrow" aria-hidden="true">←</span>
    <span>PREVIOUS</span>
  </button>
  <button id="next-scene" type="button" aria-label="Next pendulum scene">
    <span>NEXT</span>
    <span class="arrow" aria-hidden="true">→</span>
  </button>
